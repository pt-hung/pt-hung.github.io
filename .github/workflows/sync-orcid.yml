name: Sync Publications from ORCID

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and fetch ORCID
        run: |
          pip install requests
          python scripts/fetch_orcid.py

      - name: Commit and push new publications
        run: |
          git config --global user.name "ORCID Sync Bot"
          git config --global user.email "actions@github.com"
          git add _publications/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-sync publications from ORCID"
            git push
          fi
